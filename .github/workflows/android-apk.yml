name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'ubereats-promo-autofill.user.js'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 選用：設定 ANDROID_KEYSTORE_BASE64 等 Secrets 後，每次都用同一把金鑰簽章，App 可以直接覆蓋更新
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "UEPA_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets"
          else
            echo "No signing secrets configured; signing with a debug key"
          fi

      - name: Build APK
        working-directory: android
        env:
          UEPA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UEPA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UEPA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          VERSION=$(grep -oP '@version\s+\K\S+' ubereats-promo-autofill.user.js)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk ubereat_auto_fill.apk
          ls -la ubereat_auto_fill.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ubereat_auto_fill-apk
          path: ubereat_auto_fill.apk

      - name: Publish release "apk-latest"
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest ubereat_auto_fill.apk \
            --target "$GITHUB_SHA" \
            --title "Android App v$VERSION (build $GITHUB_RUN_NUMBER)" \
            --notes "在 Android 手機下載 ubereat_auto_fill.apk 並安裝。每次更新程式後都會自動重新產生。安裝與使用說明請看 README 的「Android App（APK）」一節。"
